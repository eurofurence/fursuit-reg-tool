name: Docker Build and Publish

on:
  push:
    branches:
      - 'main'
      - 'dev'
#      - '!master'
#      - '**'
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'dev-night-*'
      - 'dev-*'
      - 'alpha-*'
      - 'pre-release-*'
  pull_request:
    branches:
      - 'main'
      - 'dev'
  release:
    types:
      - created

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Disable the automatic "latest" tag (default is latest=auto, which also
          # tags latest on every semver Git tag push). "latest" is controlled
          # explicitly below so it is only applied for the main branch.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-night-latest,enable=${{ startsWith(github.ref, 'refs/tags/dev-night-') }}

      ######################################################
      # Setup Cache and BuildX
      ######################################################
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      ######################################################
      # Build and Push
      ######################################################
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
          builder: ${{ steps.buildx.outputs.name }}
          file: ./Dockerfile
          # target: production
          # context: .
          # file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}